name: Otonom Not Guncelleyici

on:
  schedule:
    # Her gün 00:00 UTC (Türkiye saati ile 03:00). GitHub bazen birkaç dakika geciktirebilir.
    - cron: '0 0 * * *'
  workflow_dispatch: # Elle de tetiklenebilir

# Bota notlar.json dosyasını güncelleme (yazma) yetkisi verir
permissions:
  contents: write

# Aynı anda iki çalışma push yarışına girmesin
concurrency:
  group: otonom-not-guncelleyici
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Tarih Bilgisini Al
        run: echo "tarih=$(TZ=Europe/Istanbul date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Gerekli Kutuphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Calistir ve Notlari Guncelle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-2.5-flash
        run: python akilli_bot.py

      - name: Degisiklikleri Siteye Kaydet
        run: |
          git config user.name "Otonom Bot"
          git config user.email "bot@users.noreply.github.com"
          git add notlar.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok, commit atlanıyor."
          else
            git commit -m "🚀 Akademik Not Güncellemesi: ${{ env.tarih }} [skip ci]"
            git push
          fi

      - name: Artifact Yedeği Olustur
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notlar-json-${{ env.tarih }}
          path: notlar.json
          retention-days: 7

      - name: Sonuc Raporu Olustur
        if: always()
        run: |
          {
            echo "### 🧠 AI Otonom İşlem Özeti"
            echo "- **Tarih:** ${{ env.tarih }}"
            echo "- **Çalışma Durumu:** ${{ job.status }}"
            echo "- **Artifact:** \`notlar-json-${{ env.tarih }}\` (7 gün saklanır)"
          } >> "$GITHUB_STEP_SUMMARY"
