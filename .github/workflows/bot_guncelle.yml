name: Otonom Not Guncelleyici

on:
  schedule:
    # Her gün gece yarısı (00:00 UTC) otomatik çalışır
    - cron: '0 0 * * *'
  workflow_dispatch: # İstersen elinle de tetikleyebilirsin

# 403 HATASININ KESİN ÇÖZÜMÜ: Bota dosyaları güncelleme (yazma) yetkisi veriyoruz
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # API yanıt vermezse botun sonsuza kadar çalışmasını engeller

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4 # En güncel sürüm (v3'ten v4'e yükseltildi)

      - name: Python Kur
        uses: actions/setup-python@v5 # En güncel sürüm
        with:
          python-version: '3.10'
          cache: 'pip' # Her seferinde sıfırdan indirmek yerine önbellek kullanıp hızlandırır

      - name: Gerekli Kutuphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Botu Calistir ve Notlari Guncelle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python akilli_bot.py
          - name: Tarih Bilgisini Al
        id: date
        run: echo "tarih=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Degisiklikleri Siteye Kaydet
        run: |
          git config --global user.name "Otonom Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add notlar.json
          
          # Dinamik commit mesajı: Her güncellemeye o günün tarihini basar
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Akademik Not Güncellemesi: ${{ env.tarih }} [skip ci]" && git push)

      - name: Bulut Yedeği (Artifact) Oluştur
        uses: actions/upload-artifact@v4
        if: always() # İşlem çökse bile yedeği almayı garanti eder
        with:
          name: notlar-json-yedeği-${{ env.tarih }}
          path: notlar.json
          retention-days: 7 # Yedekler GitHub sunucularında 7 gün saklanır
