<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS101 Akademik Notlar</title>
    
    <!-- Modern Tipografi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Kütüphaneler (Markdown, Kod Renklendirme, Matematik Formülleri) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        /* CSS Değişkenleri - Akademik Tema */
        :root {
            --bg-body: #F9F9F8;
            --bg-sidebar: #F1F1EF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --text-heading: #1A202C;
            --accent: #2B6CB0;
            --border-color: #E2E8F0;
        }

        /* Gece Modu (Dark Mode) Modülü */
        body.dark-mode {
            --bg-body: #1A202C;
            --bg-sidebar: #2D3748;
            --text-main: #E2E8F0;
            --text-muted: #A0AEC0;
            --text-heading: #F7FAFC;
            --border-color: #4A5568;
        }
        
        body.dark-mode .article-container {
            background: #2D3748;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        body.dark-mode .nav-item:hover { background-color: #4A5568; }
        body.dark-mode .nav-item.active { background-color: #2B6CB0; color: #fff; border-left-color: #63B3ED; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            line-height: 1.7;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- YAN MENÜ (SIDEBAR) --- */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-family: 'Merriweather', serif;
            font-size: 1.2rem;
            color: var(--text-heading);
            font-weight: 700;
        }

        .sidebar-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .nav-list {
            list-style: none;
            padding: 16px 0;
        }

        .nav-item {
            padding: 10px 24px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background-color: #E2E8F0;
        }

        .nav-item.active {
            background-color: #EBF8FF;
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 500;
        }

        /* --- ANA İÇERİK (MAIN CONTENT) --- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 60px;
            scroll-behavior: smooth;
        }

        .article-container {
            max-width: 800px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 50px 60px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Tipografi Hiyerarşisi */
        .article-container h1, .article-container h2, .article-container h3 {
            font-family: 'Merriweather', serif;
            color: var(--text-heading);
            margin-top: 2em;
            margin-bottom: 0.8em;
            line-height: 1.3;
        }

        .article-container h1 { font-size: 2.2rem; margin-top: 0; }
        .article-container h2 { font-size: 1.6rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        .article-container p { margin-bottom: 1.2em; font-size: 1.05rem; }
        .article-container ul, .article-container ol { margin-bottom: 1.2em; padding-left: 2em; }
        
        /* Kod Blokları */
        pre {
            background-color: #282c34;
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
            margin-bottom: 1.2em;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            background-color: rgba(0,0,0,0.05);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        
        pre code { background-color: transparent; padding: 0; color: inherit; }

        /* Yükleniyor ve Hata Durumları */
        .loading, .error {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Mobil Uyumluluk */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            .sidebar {
                position: fixed;
                z-index: 99;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 60px 20px 20px 20px; }
            .article-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Mobil Menü Butonu -->
    <button class="mobile-menu-btn" onclick="toggleMenu()">☰ Menü</button>

    <!-- Yan Menü ve Yeni Eklenen Arama/Gece Modu Araçları -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>CS101 Notları</h1>
            <p>Otonom Yapay Zeka Sistemi</p>
            
            <!-- Arama Çubuğu -->
            <input type="text" id="searchInput" placeholder="Konularda ara..." onkeyup="filterTopics()" style="width: 100%; margin-top: 15px; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main);">
            
            <!-- Gece Modu Butonu -->
            <button onclick="toggleDarkMode()" style="margin-top: 10px; width: 100%; padding: 8px; cursor: pointer; border-radius: 4px; border: none; background: var(--accent); color: white; font-weight: bold;">🌙 Gece Modu</button>
        </div>
        <ul class="nav-list" id="navList">
            <!-- JavaScript ile doldurulacak -->
        </ul>
    </aside>

    <!-- Ana İçerik Alanı -->
    <main class="main-content" id="mainContent">
        <div class="article-container" id="articleContainer">
            <div class="loading">Veriler buluttan çekiliyor... Lütfen bekleyin.</div>
        </div>
    </main>

    <script>
        const DATA_URL = 'notlar.json';
        let notesData = {};

        // Uygulamayı Başlat
        async function initApp() {
            try {
                const response = await fetch(DATA_URL + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Veri dosyasına ulaşılamadı.');
                
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        const key = item.baslik || item.konu || item.title || "İsimsiz Konu";
                        const value = item.icerik || item.not || item.content || "";
                        notesData[key] = value;
                    });
                } else {
                    notesData = data;
                }

                renderSidebar();
                
                const firstTopic = Object.keys(notesData)[0];
                if (firstTopic) {
                    loadContent(firstTopic);
                } else {
                    showError("Notlar dosyası boş.");
                }

            } catch (error) {
                console.error("Yükleme hatası:", error);
                showError("Veriler yüklenirken bir hata oluştu. Henüz bot çalışmamış olabilir.");
            }
        }

        // Yan Menüyü Oluştur
        function renderSidebar() {
            const navList = document.getElementById('navList');
            navList.innerHTML = ''; 

            Object.keys(notesData).forEach(topic => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.textContent = topic;
                li.onclick = () => {
                    loadContent(topic);
                    if (window.innerWidth <= 768) toggleMenu(); 
                };
                navList.appendChild(li);
            });
        }

        // İçeriği Ekrana Bas
        function loadContent(topic) {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                if (el.textContent === topic) el.classList.add('active');
            });

            const rawContent = notesData[topic] || "İçerik bulunamadı.";
            const container = document.getElementById('articleContainer');

            container.innerHTML = `<h1 class="topic-title">${topic}</h1>` + marked.parse(rawContent);

            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            renderMathInElement(container, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError : false
            });

            document.getElementById('mainContent').scrollTop = 0;
        }

        function showError(message) {
            document.getElementById('articleContainer').innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // YENİ MODÜL: Karanlık Mod (Dark Mode) Kontrolü
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark); 
        }

        // İlk girişte kayıtlı karanlık mod tercihini kontrol et
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        // YENİ MODÜL: Arama (Filtreleme) Sistemi
        function filterTopics() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.nav-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'block' : 'none';
            });
        }

        // Sayfa yüklendiğinde sistemi ateşle
        window.onload = initApp;
    </script>
</body>
</html>
