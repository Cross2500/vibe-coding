<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otonom CS101 Notları</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Merriweather:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #f0f2f5; --book-bg: #ffffff;
            --text-main: #1d1d1f; --text-muted: #6e6e73;
            --accent: #2563eb; --border-color: #e5e7eb;
        }

        body {
            background-color: var(--bg-body); font-family: 'Inter', sans-serif;
            color: var(--text-main); display: flex; justify-content: center;
            align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }

        .book {
            display: flex; width: 90vw; max-width: 1400px; height: 85vh;
            background: var(--book-bg); border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); position: relative;
        }

        .book::after {
            content: ''; position: absolute; left: 28%; top: 0; bottom: 0; width: 60px;
            background: linear-gradient(90deg, rgba(0,0,0,0.02) 0%, rgba(255,255,255,0.8) 50%, rgba(0,0,0,0.02) 100%);
            pointer-events: none; z-index: 10;
        }

        .sidebar { width: 28%; border-right: 1px solid var(--border-color); padding: 2.5rem; overflow-y: auto; }
        .logo { font-family: 'Merriweather', serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: var(--accent); }
        .update-info { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2rem; display: block; }
        
        .nav-list { list-style: none; padding: 0; }
        .nav-btn {
            width: 100%; text-align: left; background: none; border: none;
            padding: 12px 15px; border-radius: 8px; color: var(--text-muted);
            font-size: 1rem; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; gap: 12px; transition: all 0.2s;
        }
        .nav-btn:hover { background: rgba(37,99,235,0.05); color: var(--text-main); }
        .nav-btn.active { background: var(--accent); color: white; }

        .content-area { width: 72%; padding: 4rem 6rem; overflow-y: auto; position: relative; }
        .chapter { display: none; animation: slideUp 0.5s ease forwards; }
        .chapter.active { display: block; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-family: 'Merriweather', serif; font-size: 2.5rem; margin-bottom: 1.5rem; }
        p { font-size: 1.15rem; line-height: 1.8; color: var(--text-muted); text-align: justify; }
        
        .loading { text-align: center; font-size: 1.2rem; color: var(--accent); margin-top: 20%; }
    </style>
</head>
<body>

    <div class="book">
        <div class="sidebar">
            <div class="logo"><i class="fa-solid fa-robot"></i> Otonom Notlar</div>
            <span class="update-info" id="updateTime">Veriler yükleniyor...</span>
            <ul class="nav-list" id="navList">
                <!-- Butonlar buraya JS ile gelecek -->
            </ul>
        </div>

        <div class="content-area" id="contentArea">
            <div class="loading" id="loadingDiv">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                <p>İnternetten çekilen notlar derleniyor...</p>
            </div>
            <!-- İçerikler buraya JS ile gelecek -->
        </div>
    </div>

    <script>
        // Tarayıcı güvenlik kuralları gereği fetch işleminin çalışması için
        // bu dosyanın bir sunucu üzerinden (Localhost) açılması gerekir.
        
        fetch('notlar.json')
            .then(response => {
                if (!response.ok) throw new Error("notlar.json bulunamadı. Önce bot.py'yi çalıştırın!");
                return response.json();
            })
            .then(data => {
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('updateTime').innerHTML = `<i class="fa-solid fa-clock"></i> Son Güncelleme: ${data.son_guncelleme}`;
                
                const navList = document.getElementById('navList');
                const contentArea = document.getElementById('contentArea');

                data.bolumler.forEach((bolum, index) => {
                    // Menü Butonlarını Oluştur
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.className = `nav-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerHTML = `<i class="fa-solid ${bolum.ikon}"></i> ${bolum.baslik}`;
                    btn.onclick = () => showChapter(bolum.id, btn);
                    li.appendChild(btn);
                    navList.appendChild(li);

                    // İçerik Sayfalarını Oluştur
                    const div = document.createElement('div');
                    div.id = bolum.id;
                    div.className = `chapter ${index === 0 ? 'active' : ''}`;
                    div.innerHTML = `<h1>${bolum.baslik}</h1><p>${bolum.icerik}</p>`;
                    contentArea.appendChild(div);
                });
            })
            .catch(error => {
                document.getElementById('loadingDiv').innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation fa-2x" style="color: red;"></i>
                    <p><b>Hata:</b> ${error.message}</p>
                    <p style="font-size: 0.9rem">Lütfen önce klasörde terminal açıp <code>python bot.py</code> yazarak botu çalıştırın, ardından <code>python -m http.server</code> yazarak siteyi başlatın.</p>
                `;
            });

        // Sayfa Geçiş Fonksiyonu
        function showChapter(chapterId, btnElement) {
            document.querySelectorAll('.chapter').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(chapterId).classList.add('active');
            btnElement.classList.add('active');
            document.getElementById('contentArea').scrollTo(0,0);
        }
    </script>
</body>
</html>
