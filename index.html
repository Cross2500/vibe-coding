<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS101 Akademik Notlar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

<style>
:root {
  --bg-body: #F9F9F8;
  --bg-sidebar: #F1F1EF;
  --text-main: #2D3748;
  --text-muted: #718096;
  --text-heading: #1A202C;
  --accent: #2B6CB0;
  --border-color: #E2E8F0;
}
body.dark-mode {
  --bg-body: #1A202C;
  --bg-sidebar: #2D3748;
  --text-main: #E2E8F0;
  --text-muted: #A0AEC0;
  --text-heading: #F7FAFC;
  --border-color: #4A5568;
}
body.dark-mode .article-container { background: #2D3748; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
body.dark-mode .nav-item:hover { background-color: #4A5568; }
body.dark-mode .nav-item.active { background-color: #2B6CB0; color: #fff; border-left-color: #63B3ED; }
body.dark-mode code { background-color: rgba(255,255,255,0.12); }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-body);
  color: var(--text-main);
  display: flex;
  height: 100vh;
  overflow: hidden;
  line-height: 1.7;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.sidebar {
  width: 300px;
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  transition: transform 0.3s ease, background-color 0.3s ease;
}
.sidebar-header { padding: 24px; border-bottom: 1px solid var(--border-color); }
.sidebar-header h1 { font-family: 'Merriweather', serif; font-size: 1.2rem; color: var(--text-heading); font-weight: 700; }
.sidebar-header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

.ders-grup { border-bottom: 1px solid var(--border-color); }
.ders-grup summary {
  cursor: pointer;
  list-style: none;
  padding: 14px 24px;
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--text-heading);
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
.ders-grup summary::-webkit-details-marker { display: none; }
.ders-grup summary::before { content: '▸'; display: inline-block; transition: transform 0.2s; color: var(--text-muted); }
.ders-grup[open] summary::before { transform: rotate(90deg); }
.ders-ad { flex: 1; }
.ders-sayac { font-size: 0.72rem; font-weight: 500; color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 10px; padding: 1px 8px; }

.nav-list { list-style: none; padding: 0 0 10px 0; }
.nav-item {
  padding: 8px 24px 8px 42px;
  cursor: pointer;
  font-size: 0.9rem;
  line-height: 1.4;
  color: var(--text-main);
  transition: all 0.2s;
  border-left: 3px solid transparent;
}
.nav-item:hover { background-color: #E2E8F0; }
.nav-item.active { background-color: #EBF8FF; color: var(--accent); border-left-color: var(--accent); font-weight: 500; }

.main-content { flex: 1; overflow-y: auto; padding: 60px; scroll-behavior: smooth; }

.article-container {
  max-width: 800px;
  margin: 0 auto;
  background: #FFFFFF;
  padding: 50px 60px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
  border: 1px solid var(--border-color);
  font-family: 'Inter', sans-serif;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}

.ders-etiketi {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}

.article-container h1,
.article-container h2,
.article-container h3,
.article-container h4 {
  font-family: 'Merriweather', serif;
  color: var(--text-heading);
  margin-top: 2em;
  margin-bottom: 0.8em;
  line-height: 1.3;
}
.article-container h1 { font-size: 2.2rem; margin-top: 0; }
.article-container h2,
.article-container h3 { font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
.article-container h4 { font-size: 1.15rem; }

.article-container p { margin-bottom: 1.2em; font-size: 1.05rem; }
.article-container ul, .article-container ol { margin-bottom: 1.2em; padding-left: 2em; }
.article-container li { margin-bottom: 0.4em; font-size: 1.05rem; }
.article-container strong { font-weight: 600; color: var(--text-heading); }

.article-container blockquote {
  border-left: 4px solid var(--accent);
  background: rgba(43, 108, 176, 0.08);
  padding: 10px 16px;
  margin: 0 0 1.5em 0;
  border-radius: 0 6px 6px 0;
  color: var(--text-muted);
}
.article-container blockquote p { margin: 0; font-size: 0.95rem; }
.article-container hr { border: none; border-top: 1px solid var(--border-color); margin: 1.5em 0; }

.article-container table { border-collapse: collapse; margin-bottom: 1.2em; display: block; overflow-x: auto; }
.article-container th, .article-container td { border: 1px solid var(--border-color); padding: 8px 12px; text-align: left; }

pre { background-color: #282c34; border-radius: 6px; padding: 16px; overflow-x: auto; margin-bottom: 1.2em; font-size: 0.9rem; }
code, pre code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace; }
code { background-color: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 4px; font-size: 0.9em; }
pre code, pre code.hljs { background-color: transparent; padding: 0; color: inherit; }

.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

.loading, .error { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem; }

.mobile-menu-btn {
  display: none;
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 100;
  background: var(--bg-sidebar);
  border: 1px solid var(--border-color);
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-main);
}

@media (max-width: 768px) {
  .mobile-menu-btn { display: block; }
  .sidebar { position: fixed; z-index: 99; height: 100%; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { padding: 60px 20px 20px 20px; }
  .article-container { padding: 30px 20px; }
}
</style>
</head>
<body>

<button class="mobile-menu-btn" onclick="toggleMenu()">☰ Menü</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>CS101 Notları</h1>
    <p>Otonom Yapay Zeka Sistemi</p>
    <input type="text" id="searchInput" placeholder="Konularda ara..." onkeyup="filterTopics()" style="width: 100%; margin-top: 15px; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main);">
    <button onclick="toggleDarkMode()" style="margin-top: 10px; width: 100%; padding: 8px; cursor: pointer; border-radius: 4px; border: none; background: var(--accent); color: white; font-weight: bold;">🌙 Gece Modu</button>
  </div>
  <div id="navList"></div>
</aside>

<main class="main-content" id="mainContent">
  <div class="article-container" id="articleContainer">
    <div class="loading">Veriler buluttan çekiliyor... Lütfen bekleyin.</div>
  </div>
</main>

<script>
const DATA_URL = 'notlar.json';

// Bot henüz ders bilgisi eklemediyse eski bölümlerin hangi derse gireceği
// (akilli_bot.py içindeki ESKI_BOLUMLER ile aynı olmalı)
const ESKI_DERS = {
  'bolum-1': ['Algoritmalar ve Bellek Yönetimi', 1],
  'bolum-2': ['Lineer Cebir', 1],
  'bolum-4': ['Yapay Zeka ve Veri Bilimi', 1],
  'bolum-5': ['Yapay Zeka ve Veri Bilimi', 2],
  'bolum-6': ['Yapay Zeka ve Veri Bilimi', 3],
  'bolum-7': ['Yapay Zeka ve Veri Bilimi', 4]
};

let items = [];
let dersGruplari = [];

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Yazı olarak kalmış \n karakterlerini gerçek satır sonuna çevirir
function icerikOnar(m) {
  const literal = (m.match(/\\n/g) || []).length;
  const gercek = (m.match(/\n/g) || []).length;
  if (literal >= 5 && gercek < literal / 2) {
    m = m.replace(/\\n(?!abla|eq|otin|ewline|leq|geq|(?:u|ot|e)(?!\p{L}))/gu, '\n').replace(/\\"/g, '"');
  }
  return m.replace(/"\}\s*$/, '');
}

// Harf arasına rakam karışmış (G1ri11 gibi) bozuk içeriği yakalar
function bozukMu(m) {
  const duz = m.replace(/```[\s\S]*?```/g, ' ').replace(/\$\$[\s\S]+?\$\$/g, ' ')
               .replace(/\$[^$\n]+?\$/g, ' ').replace(/`[^`\n]*`/g, ' ');
  return (duz.match(/(?<=\p{L})\d(?=\p{L})/gu) || []).length >= 5;
}

// Markdown'ı HTML'e çevirir; formülleri Markdown'ın bozmasını önler, çıktıyı temizler.
function renderMarkdown(raw) {
  const maths = [];
  const stash = (m) => { maths.push(m); return '%%MATH' + (maths.length - 1) + '%%'; };

  const parcalar = raw.split(/(```[\s\S]*?```|`[^`\n]*`)/);
  const korunmus = parcalar.map((p, i) => {
    if (i % 2 === 1) return p;
    return p
      .replace(/\$\$[\s\S]+?\$\$/g, stash)
      .replace(/\$[^$\n]+?\$/g, stash);
  }).join('');

  let html = marked.parse(korunmus);
  if (typeof DOMPurify !== 'undefined') html = DOMPurify.sanitize(html);

  return html.replace(/%%MATH(\d+)%%/g, (_, n) => escapeHtml(maths[Number(n)]));
}

async function initApp() {
  try {
    const response = await fetch(DATA_URL + '?t=' + new Date().getTime());
    if (!response.ok) throw new Error('Veri dosyasına ulaşılamadı.');
    const data = await response.json();

    let itemsList = [];
    if (Array.isArray(data)) {
      itemsList = data;
    } else if (data && Array.isArray(data.bolumler)) {
      itemsList = data.bolumler;
    } else if (typeof data === 'object' && data !== null) {
      for (const [key, value] of Object.entries(data)) {
        if (key !== 'son_guncelleme' && typeof value === 'string') {
          itemsList.push({ baslik: key, icerik: value });
        }
      }
    }

    itemsList.forEach((item, idx) => {
      const baslik = item.baslik || item.konu || item.title || 'İsimsiz Konu';
      const icerik = icerikOnar(item.icerik || item.not || item.content || '');
      if (!icerik || bozukMu(icerik)) return;
      const eski = ESKI_DERS[item.id] || [];
      items.push({
        id: item.id || ('oge-' + idx),
        baslik: baslik,
        icerik: icerik,
        ders: item.ders || eski[0] || 'Diğer Notlar',
        sira: Number(item.sira) || eski[1] || (idx + 1),
        seviye: item.seviye || ''
      });
    });

    gruplariOlustur();
    renderSidebar();

    if (items.length > 0) {
      loadContent(items[items.length - 1].id);
    } else {
      showError('Gösterilecek geçerli ders notu bulunamadı.');
    }
  } catch (error) {
    console.error('Yükleme hatası:', error);
    showError('Veriler yüklenirken bir hata oluştu. Henüz bot çalışmamış olabilir.');
  }
}

function gruplariOlustur() {
  const harita = new Map();
  items.forEach(it => {
    if (!harita.has(it.ders)) harita.set(it.ders, []);
    harita.get(it.ders).push(it);
  });
  dersGruplari = Array.from(harita.entries()).map(([ad, liste]) => ({
    ad: ad,
    liste: liste.sort((a, b) => a.sira - b.sira)
  }));
}

function renderSidebar() {
  const nav = document.getElementById('navList');
  nav.innerHTML = '';

  dersGruplari.forEach(grup => {
    const details = document.createElement('details');
    details.className = 'ders-grup';
    details.open = true;

    const summary = document.createElement('summary');
    const ad = document.createElement('span');
    ad.className = 'ders-ad';
    ad.textContent = grup.ad;
    const sayac = document.createElement('span');
    sayac.className = 'ders-sayac';
    sayac.textContent = grup.liste.length + ' bölüm';
    summary.appendChild(ad);
    summary.appendChild(sayac);
    details.appendChild(summary);

    const ul = document.createElement('ul');
    ul.className = 'nav-list';
    grup.liste.forEach(it => {
      const li = document.createElement('li');
      li.className = 'nav-item';
      li.dataset.id = it.id;
      li.textContent = it.sira + '. ' + it.baslik;
      li.onclick = () => {
        loadContent(it.id);
        if (window.innerWidth <= 768) toggleMenu();
      };
      ul.appendChild(li);
    });
    details.appendChild(ul);
    nav.appendChild(details);
  });
}

function loadContent(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  const container = document.getElementById('articleContainer');
  container.innerHTML =
    '<div class="ders-etiketi"></div><h1 class="topic-title"></h1>' + renderMarkdown(it.icerik);

  let etiket = it.ders + ' · Bölüm ' + it.sira;
  if (it.seviye) etiket += ' · ' + it.seviye;
  container.querySelector('.ders-etiketi').textContent = etiket;
  container.querySelector('.topic-title').textContent = it.baslik;
  container.querySelectorAll('h1:not(.topic-title)').forEach(h => h.remove());

  document.querySelectorAll('pre code').forEach((block) => {
    hljs.highlightElement(block);
  });

  if (typeof renderMathInElement === 'function') {
    renderMathInElement(container, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    });
  }

  document.getElementById('mainContent').scrollTop = 0;
}

function showError(message) {
  const container = document.getElementById('articleContainer');
  container.innerHTML = '<div class="error"></div>';
  container.querySelector('.error').textContent = '⚠️ ' + message;
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}

function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  try { localStorage.setItem('darkMode', isDark); } catch (e) {}
}

try {
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark-mode');
  }
} catch (e) {}

function filterTopics() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.ders-grup').forEach(grup => {
    let gorunen = 0;
    grup.querySelectorAll('.nav-item').forEach(item => {
      const eslesti = item.textContent.toLowerCase().includes(query);
      item.style.display = eslesti ? 'block' : 'none';
      if (eslesti) gorunen++;
    });
    grup.style.display = gorunen > 0 ? 'block' : 'none';
    if (query) grup.open = true;
  });
}

window.onload = initApp;
</script>
</body>
</html>
